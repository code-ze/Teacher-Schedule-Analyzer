name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is still set to "Deploy from a branch", GitHub also runs its
      # own "pages build and deployment" job on every push, which publishes the
      # unbuilt sources. Wait for it so our built site is the one left live.
      - name: Wait for legacy branch Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            status=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "none"')
            echo "legacy pages build: $status"
            if [ "$status" = "completed" ]; then break; fi
            if [ "$status" = "none" ] && [ "$i" -ge 6 ]; then break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
